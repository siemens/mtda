[tox]
envlist = py38,py39,py310,py311,py312,py313

[testenv]
allowlist_externals = bash, python
deps =
    flake8
    pytest
    reuse
    python-debian < 0.1.44
commands_pre =
    python scripts/generate-grpc-stubs.py --force
commands =
    flake8
    reuse lint
    bash ./scripts/test-using-docker

[flake8]
exclude = .venv,build,.pybuild,debian,dist,docs,*.egg-info,__pycache__,*_pb2.py,*_pb2_grpc.py,mtda/scripts/__init__.py,mtda/scripts/ipc227e.py,mtda/scripts/qemu.py
max-line-length = 120
