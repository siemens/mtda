# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
[main]
debug = 2

# ---------------------------------------------------------------------------
# Initial environment
# ---------------------------------------------------------------------------
[environment]
variant=qemu

# ---------------------------------------------------------------------------
# Remote settings
# ---------------------------------------------------------------------------
# Set "control" to the TCP/IP port number for the gRPC control interface
[remote]
control = 5556
host    = localhost

# ---------------------------------------------------------------------------
# Console settings
# ---------------------------------------------------------------------------
[console]
variant=qemu

# ---------------------------------------------------------------------------
# Power Control settings
# ---------------------------------------------------------------------------
[power]
variant=qemu
cpu=host
smp=0
machine=pc
memory=2048
storage.0=/var/lib/mtda/ssd.img
storage.0.size=16
#storage.1=/var/lib/mtda/extra-ssd.img
#storage.1.size=16
watchdog=i6300esb
#uuid=11111111-2222-3333-4444-555555555555

# ---------------------------------------------------------------------------
# Boot firmware settings ("mtda-cli firmware efi|legacy" to switch, qemu
# power controller only). The active mode is remembered across restarts of
# the mtda-agent in /var/lib/mtda/qemu-firmware. Until a mode has been
# selected at least once, "default" below picks the starting mode (defaults
# to "efi" itself if omitted). Legacy (SeaBIOS) boot needs no section at all
# unless a custom BIOS image should be used instead of QEMU's built-in one.
# ---------------------------------------------------------------------------
#[firmware]
#default=efi

[efi]
pflash_ro=/usr/share/ovmf/OVMF.fd
pflash_rw=/var/lib/mtda/qemu-ovmf-vars.fd

[legacy]
#bios=/usr/share/seabios/bios.bin

# ---------------------------------------------------------------------------
# Shared Storage settings
# ---------------------------------------------------------------------------
[storage]
variant=qemu
# Base image for 'storage write'
file=/var/lib/mtda/usb-shared-storage.img
# CoW image for 'storage commit/rollback'
cow=/var/lib/mtda/usb-shared-storage.qcow2
# size in GiB
size=32

# ---------------------------------------------------------------------------
# Keyboard settings
# ---------------------------------------------------------------------------
[keyboard]
variant=qemu

# ---------------------------------------------------------------------------
# Mouse settings
# ---------------------------------------------------------------------------
[mouse]
variant=qemu

# ---------------------------------------------------------------------------
# USB devices
# ---------------------------------------------------------------------------
[usb]
ports=1

[usb1]
class=MSC
variant=qemu_mass_storage
file=/var/lib/mtda/usb-data-storage.img

# ---------------------------------------------------------------------------
# Video capture
# ---------------------------------------------------------------------------
[video]
variant=qemu
sink=ximagesink
