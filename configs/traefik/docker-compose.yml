#
# Runs Traefik as a systemd-managed, auto-restarting container so it comes
# back up after a crash or a machine reboot (Docker/Podman's own service
# must be enabled for the latter, e.g. "systemctl enable --now docker").
#
# Usage:
#   $ docker compose -f docker-compose.yml up -d
#
# ---------------------------------------------------------------------------

services:
  traefik:
    image: traefik:v3.1
    container_name: mtda-tv-traefik
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
