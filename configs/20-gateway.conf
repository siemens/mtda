#
# Lets mtda-tv act as a discovery source for a reverse proxy (Traefik's HTTP
# provider), so agent tiles can be reached through a single hostname/port
# instead of linking directly to each agent's own mtda-www instance. This
# requires Traefik (or another reverse proxy able to consume the same-shaped
# dynamic configuration) to be installed and pointed at mtda-tv's
# /api/traefik-config endpoint; see the mtda-tv-gateway package
# documentation for setup instructions.

[gateway]
enabled = true

# Path prefix used to route to agents, e.g. /agents/<name>/
# prefix = /agents

# Whether generated Traefik routers should include a stripPrefix
# middleware (so the agent's own mtda-www still sees paths rooted at /).
# Disable only if your reverse proxy already strips the prefix itself.
# strip_prefix = true

# Base URL where the reverse proxy is reachable, e.g. http://tv.example.com
# or http://<host>:8000. Tile links are relative to mtda-tv's own origin by
# default, which only resolves correctly when mtda-tv's grid page is itself
# served through the same reverse proxy. Set this if the grid is browsed
# directly on mtda-tv's own port (bypassing the proxy) so tile links keep
# pointing at the proxy instead of mtda-tv itself.
# base_url = http://tv.example.com

# Name of a Traefik entry point that terminates TLS/mTLS in front of the
# generated routes (see docs/hardening.rst), e.g. "websecure" matching the
# entryPoints.websecure block in traefik.yml. Leave unset to only ever
# generate plain (non-TLS) routes, exactly as if this option didn't exist.
# A Traefik router needs its own "tls" section to be reachable over a TLS
# entry point at all - and is then excluded from plain entry points - so
# setting this makes mtda-tv generate a second, TLS-only router per agent
# alongside the original plain one, rather than replacing it.
# tls_entry_point = websecure
