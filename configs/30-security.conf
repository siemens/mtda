#
# Hardens an agent that sits behind a reverse proxy (Traefik) terminating
# mutual TLS (mTLS). Only enable trust_proxy_identity once "bind" and/or a
# firewall guarantee the agent's gRPC port cannot be reached other than
# through that proxy - see docs/hardening.rst for the full walkthrough,
# including the two deployment shapes below.

[security]
# Restrict the gRPC control port to an address reachable only by the
# reverse proxy. Defaults to "[::]" (all interfaces).
#
#  * Traefik + agent on the SAME host (e.g. a single dev box): use the
#    loopback address.
bind = 127.0.0.1
#
#  * Traefik on a separate gateway host, agent on its own
#    device-under-test node (e.g. Traefik + mtda-tv on one machine,
#    mtda-service/mtda-www on each DUT node): bind to that node's
#    private/management interface instead, and also enable server_tls
#    below so the Traefik<->agent hop is itself authenticated and
#    encrypted rather than relying on network trust alone.
# bind = 10.0.0.5

# Derive the session identity used for locking/idle tracking from the
# reverse proxy's verified TLS-client-certificate header instead of the
# caller-supplied "mtda-session" metadata (which anyone can forge).
# Defaults to false. Only safe to enable once the agent cannot be reached
# other than through the proxy (see "bind" above) - otherwise a client
# could still forge the header directly.
trust_proxy_identity = true

# gRPC metadata key carrying the proxy-verified client identity. Matches
# Traefik's passTLSClientCert middleware "info" header by default; only the
# Subject CN is used to derive the session name.
# identity_header = x-forwarded-tls-client-cert-info

# --- Server-side TLS (this agent's own gRPC listener) ----------------------
# Needed when Traefik and the agent run on separate nodes: without it, the
# identity header above would travel over the network in the clear between
# Traefik and the agent, and could be spoofed by anyone able to reach the
# agent directly. Not needed when Traefik and the agent share the same host
# and "bind" is loopback-only (traffic never leaves the machine).
#
# server_tls = true
# server_cert = /etc/mtda/tls/agent.pem
# server_key = /etc/mtda/tls/agent-key.pem
# Verify Traefik itself on this hop (mutual TLS) - see serversTransport in
# configs/traefik/dynamic-mtls.yml for the matching Traefik-side settings.
# server_client_ca = /etc/mtda/tls/ca.pem
# server_require_client_cert = true

# --- Client-side TLS (mtda-cli, mtda-www, etc. reaching a remote agent) ----
# Lets MTDA's own client tooling connect through the same Traefik mTLS
# front-end instead of only being usable from an already-trusted network.
# Usually only needed on the machine(s) users run mtda-cli from, not on the
# agent itself; a one-off connection can instead pass "mtdas://host:port"
# to -r/--remote or $MTDA_REMOTE without touching this file (see
# docs/hardening.rst).
#
# tls = true
# tls_ca = /etc/mtda/tls/ca.pem
# tls_cert = /etc/mtda/tls/client.pem
# tls_key = /etc/mtda/tls/client-key.pem
# tls_server_name =
